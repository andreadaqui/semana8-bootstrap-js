<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Web</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Menú de navegación -->   

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SOSERMIN</span>
    </div>
</nav>

<div class="container mt-4">

    <!-- Carrusel -->
    <div id="carouselExample" class="carousel slide mb-4">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imagenes/logo-sosermin.jpg" class="d-block w-50" alt="imagenes/logo-sosermin 40">
                <img src="imagenes/img3.jpg" class="d-block w-50" alt="imagenes/img3 = 50">
            </div>
            <div class="carousel-item">
                <img src="imagenes/logo-sosermin.jpg " class="d-block w-50" alt=" 10">
                
                <img src="imagenes/logo-sosermin.jpg" class="de d-block w-50" alt="">

            </div>
        </div>
    </div>

    <!-- Tabla -->
    <h2>SERVICIOS </h2>
    <table class="table table-dark">
        <thead class="table-stripe">
            <tr>
                <th>Producto</th>
                <th>Descripcion</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Servicios </td>
                <td>Servicios Mineros  </td>
                <td>-0966666233-</td>
                
                
            </tr>
        </tbody>
    </table>

    <!-- Formulario -->
    <h2>Contacto</h2>
    <form id="contactForm">
        <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
        <input type="email" id="email" class="form-control mb-2" placeholder="Correo">
        <textarea id="mensaje" class="form-control mb-2" placeholder="Mensaje"></textarea>
        <button class="btn btn-primary">Enviar</button>
    </form>

    <button class="btn btn-warning mt-3" onclick="mostrarAlerta()">
        Mostrar alerta
    </button>

</div>

<footer class="bg-dark text-white text-center p-3 mt-4">
    © 2026
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript propio -->
<script src="script.js"></script>

</body>
</html>
